name: Sync Upstream Stable Tag

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Optionally specify an exact stable tag to sync (e.g. v0.5.55)"
        required: false
        default: ""

concurrency:
  group: sync-upstream-tag
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  ISSUE_TITLE_PREFIX: "Manual sync needed:"

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Installs the version pinned in package.json#packageManager. Must run
        # before setup-node so its `cache: pnpm` can locate the pnpm store.

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check upstream stable tag
        id: check
        run: |
          python3 scripts/fork/check-upstream-tag.py --github-output "$GITHUB_OUTPUT"

      - name: Prepare sync PR (merge upstream, preserve fork automation)
        id: sync
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ github.event.inputs.force_tag || steps.check.outputs.latest_tag }}"
          TARGET_COMMIT="${{ steps.check.outputs.latest_commit }}"

          if [[ -n "${{ github.event.inputs.force_tag }}" && "${{ github.event.inputs.force_tag }}" != "${{ steps.check.outputs.latest_tag }}" ]]; then
            # Resolve target commit for force tag
            TARGET_COMMIT=$(git ls-remote --tags https://github.com/decolua/9router.git "refs/tags/${TARGET_TAG}^{}" | awk '{print $1}')
            if [[ -z "$TARGET_COMMIT" ]]; then
              TARGET_COMMIT=$(git ls-remote --tags https://github.com/decolua/9router.git "refs/tags/${TARGET_TAG}" | awk '{print $1}')
            fi
          fi

          echo "Target sync tag: ${TARGET_TAG} (${TARGET_COMMIT})"

          if ! bash scripts/fork/create-sync-pr.sh "${TARGET_TAG}" "${TARGET_COMMIT}" "https://github.com/decolua/9router.git"; then
            # Only a merge conflict is a handled outcome (fork patches colliding
            # with upstream changes). Surface it as an issue — a human or agent
            # resolves it with the sync-upstream skill. Anything else is a real
            # failure and keeps the red X.
            CONFLICTED=$(git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/')
            if [[ -z "$CONFLICTED" ]]; then
              echo "Sync script failed without a merge conflict."
              exit 1
            fi
            git merge --abort 2>/dev/null || true
            BODY=$(printf 'Upstream `%s` (`%s`) cannot be merged automatically. Conflicting files:\n%s\n\nResolve manually: rebase the fork onto the upstream tag, preserving every fork patch (see `FORK.md`), verify tests + build, then push master.' "$TARGET_TAG" "$TARGET_COMMIT" "$CONFLICTED")
            EXISTING=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | startswith("'"${ISSUE_TITLE_PREFIX}"'")) | .number] | first // empty')
            if [[ -z "$EXISTING" ]]; then
              gh issue create --title "${ISSUE_TITLE_PREFIX} upstream ${TARGET_TAG} conflicts with fork patches" --body "$BODY"
            else
              gh issue comment "$EXISTING" --body "$BODY"
            fi
            echo "handled=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Install dependencies (non-frozen; resolves and vets new versions)
        if: ${{ steps.sync.outputs.handled != 'conflict' && (steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '') }}
        run: pnpm install

      - name: Run regression tests on merged tree
        if: ${{ steps.sync.outputs.handled != 'conflict' && (steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '') }}
        run: pnpm -C tests exec vitest run translator/gemini-tool-result.test.js translator/bugs-antigravity.test.js

      # Upstream dependency bumps change resolution → commit the refreshed
      # lockfile into the sync PR so the release pipeline's frozen install matches.
      - name: Commit refreshed pnpm-lock.yaml into the sync PR
        if: ${{ steps.sync.outputs.handled != 'conflict' && (steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '') }}
        run: |
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if ! git diff --quiet pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m "chore(sync): refresh pnpm lockfile for upstream dependency changes"
            git push origin "$BRANCH"
          else
            echo "pnpm-lock.yaml unchanged."
          fi

      # Merging the PR pushes master, which triggers Fork Release — the only
      # pipeline that builds images and promotes them to production.
      - name: Merge sync PR and close stale conflict issues
        if: ${{ steps.sync.outputs.handled != 'conflict' && (steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$(cat /tmp/fork-sync-pr-number)" --merge --delete-branch
          STALE=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | startswith("'"${ISSUE_TITLE_PREFIX}"'")) | .number] | join(" ")')
          for n in $STALE; do
            gh issue close "$n" --comment "Resolved by automated sync; the release pipeline is building the new image."
          done
