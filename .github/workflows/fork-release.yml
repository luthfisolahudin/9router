name: Fork Release

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate (tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Installs the version pinned in package.json#packageManager.

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Gemini regression tests
        run: pnpm -C tests exec vitest run translator/gemini-tool-result.test.js translator/bugs-antigravity.test.js

      - name: Audit production dependencies (high and above fail the release)
        run: pnpm audit --prod --audit-level high

      - name: Build Next.js application
        run: pnpm run build

  build:
    name: Build linux/${{ matrix.arch }} image
    needs: [validate]
    if: |
      needs.validate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native per-arch build pushed by digest; the release job merges the two
      # digests into one multi-arch manifest. Registry buildcache is persistent
      # (unlike the GHA cache) so arm64 layers never go cold.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release (merge manifest, smoke, promote)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Extract metadata & determine version tags
        id: meta-info
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          VERSION=$(python3 -c "import json; f=open('package.json'); print(json.load(f).get('version', '0.0.0'))")
          SHORT_SHA=$(echo "${SHA}" | cut -c1-8)
          TAG_NAME=""
          if [[ "${REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${REF_NAME}"
          elif [[ -f ".github/fork-metadata.json" ]]; then
            TAG_NAME=$(python3 -c "import json; f=open('.github/fork-metadata.json'); print(json.load(f).get('synced_tag', ''))")
          fi
          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Identified Version: ${VERSION}, Tag: ${TAG_NAME}, SHA: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:io.9router-fork.upstream-tag=${{ steps.meta-info.outputs.tag_name }}" \
            --tag "${{ env.GHCR_IMAGE }}:${{ steps.meta-info.outputs.tag_name }}" \
            --tag "${{ env.GHCR_IMAGE }}:sha-${{ steps.meta-info.outputs.short_sha }}" \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Resolve multi-arch manifest digest
        id: manifest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:sha-${{ steps.meta-info.outputs.short_sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Multi-arch manifest digest: ${DIGEST}"

      - name: Smoke-test published digest
        run: bash scripts/fork/smoke-test.sh "${{ env.GHCR_IMAGE }}@${{ steps.manifest.outputs.digest }}" 20128

      - name: Promote tested digest to production
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          echo "Promoting image digest: ${DIGEST}"
          # Promote image digest to production while preserving old production as production-previous
          bash scripts/fork/promote-image.sh "ghcr.io" "${{ github.repository }}" "${DIGEST}"
