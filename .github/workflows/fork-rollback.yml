name: Fork Manual Rollback

on:
  workflow_dispatch:
    inputs:
      target_image_ref:
        description: "Optional specific image tag/digest to restore (defaults to production-previous)"
        required: false
        default: ""

concurrency:
  group: rollback-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  rollback:
    name: Rollback Production Image
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute rollback
        env:
          CUSTOM_TARGET: ${{ github.event.inputs.target_image_ref }}
        run: |
          if [[ -n "$CUSTOM_TARGET" ]]; then
            echo "Rolling back production tag directly to custom target: ${CUSTOM_TARGET}"
            bash scripts/fork/promote-image.sh "ghcr.io" "${{ github.repository }}" "${CUSTOM_TARGET}"
          else
            echo "Rolling back production tag from production-previous..."
            bash scripts/fork/rollback-image.sh "ghcr.io" "${{ github.repository }}"
          fi
