name: Fork Manual Rollback

on:
  workflow_dispatch:
    inputs:
      target_image_ref:
        description: "Optional specific image tag/digest to restore (defaults to production-previous)"
        required: false
        default: ""

concurrency:
  group: rollback-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  rollback:
    name: Rollback Production Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute rollback
        env:
          CUSTOM_TARGET: ${{ github.event.inputs.target_image_ref }}
        run: |
          if [[ -n "$CUSTOM_TARGET" ]]; then
            echo "Rolling back production tag directly to custom target: ${CUSTOM_TARGET}"
            bash scripts/fork/promote-image.sh "ghcr.io" "${{ github.repository }}" "${CUSTOM_TARGET}"
          else
            echo "Rolling back production tag from production-previous..."
            bash scripts/fork/rollback-image.sh "ghcr.io" "${{ github.repository }}"
          fi
