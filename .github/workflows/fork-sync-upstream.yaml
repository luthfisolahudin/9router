name: Sync Upstream Stable Tag

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Optionally specify an exact stable tag to sync (e.g. v0.5.55)"
        required: false
        default: ""

concurrency:
  group: sync-upstream-tag
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js + pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          # Node comes from .node-version, pnpm from
          # package.json#devEngines.packageManager (checksum-verified).
          # The sync script performs its own installs.
          install: false
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check upstream stable tag
        id: check
        run: |
          python3 scripts/fork/check-upstream-tag.py --github-output "$GITHUB_OUTPUT"

      - name: Prepare sync PR (merge upstream, preserve fork automation)
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ github.event.inputs.force_tag || steps.check.outputs.latest_tag }}"
          TARGET_COMMIT="${{ steps.check.outputs.latest_commit }}"

          if [[ -n "${{ github.event.inputs.force_tag }}" && "${{ github.event.inputs.force_tag }}" != "${{ steps.check.outputs.latest_tag }}" ]]; then
            # Resolve target commit for force tag
            TARGET_COMMIT=$(git ls-remote --tags https://github.com/decolua/9router.git "refs/tags/${TARGET_TAG}^{}" | awk '{print $1}')
            if [[ -z "$TARGET_COMMIT" ]]; then
              TARGET_COMMIT=$(git ls-remote --tags https://github.com/decolua/9router.git "refs/tags/${TARGET_TAG}" | awk '{print $1}')
            fi
          fi

          echo "Target sync tag: ${TARGET_TAG} (${TARGET_COMMIT})"

          if ! bash scripts/fork/create-sync-pr.sh "${TARGET_TAG}" "${TARGET_COMMIT}" "https://github.com/decolua/9router.git"; then
            # Only a merge conflict is a handled outcome (fork patches colliding
            # with upstream changes). Surface it on the run summary and as an
            # annotation; this repo keeps issues disabled.
            CONFLICTED=$(git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/')
            if [[ -z "$CONFLICTED" ]]; then
              echo "Sync script failed without a merge conflict."
              exit 1
            fi
            git merge --abort 2>/dev/null || true
            {
              echo "## Manual sync needed: ${TARGET_TAG}"
              echo ""
              echo "Upstream \`${TARGET_TAG}\` (\`${TARGET_COMMIT}\`) conflicts with fork patches."
              echo ""
              echo "Conflicting files:"
              echo "${CONFLICTED}"
              echo ""
              echo "Resolve with \`.agents/skills/sync-upstream/SKILL.md\`, then push master."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Manual sync needed::Upstream ${TARGET_TAG} conflicts with fork patches: $(echo "${CONFLICTED}" | tr '\n' ' ')"
            exit 1
          fi

      - name: Install dependencies (non-frozen; resolves and vets new versions)
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        run: pnpm install

      - name: Install ffmpeg for STT tests
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify fork patch ledger
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        run: node scripts/fork/verify-patches.mjs

      - name: Run full test suite against known-red baseline
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        run: node scripts/fork/test-gate.mjs

      - name: Build Next.js application
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        run: pnpm run build

      # Upstream dependency bumps change resolution → commit the refreshed
      # lockfile into the sync PR so the release pipeline's frozen install matches.
      - name: Commit refreshed pnpm-lock.yaml into the sync PR
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        run: |
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if ! git diff --quiet pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m "chore(sync): refresh pnpm lockfile for upstream dependency changes"
            git push origin "$BRANCH"
          else
            echo "pnpm-lock.yaml unchanged."
          fi

      # Merging the PR pushes master, which triggers Fork Release — the only
      # pipeline that builds images and promotes them to production.
      - name: Merge sync PR
        if: ${{ steps.check.outputs.has_update == 'true' || github.event.inputs.force_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$(cat /tmp/fork-sync-pr-number)" --merge --delete-branch
